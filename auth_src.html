<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signing in · Pocket Passer</title><link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>html,body{margin:0;height:100%;background:#070d18;color:#e8efe9;font:16px/1.4 system-ui,sans-serif}body{display:grid;place-items:center;text-align:center;padding:16px;box-sizing:border-box}</style></head>
<body><p id="m">Signing you in…</p>
<script type="module">
// Google sends the player here (via Supabase) with ?code=…; trade it for a session (the PKCE verifier is in this origin's
// localStorage, written by the game), then tell the game window and close. Opened without a game window: go back to the game.
const SUPA=/*SUPA*/;
const q=new URL(location.href).searchParams,back=q.get('back')||'./';let ok=false;
try{const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');
  const c=createClient(SUPA.url,SUPA.key,{auth:{persistSession:true,detectSessionInUrl:false,flowType:'pkce'}});
  let err='';if(q.get('code')){const {error}=await c.auth.exchangeCodeForSession(q.get('code'));if(error){err=error.message||String(error);console.error(error);}}
  else if(q.get('error_description'))err=q.get('error_description');
  // what counts is whether a session exists now (the code can already have been used, e.g. a reload or a second load of this page)
  const {data}=await c.auth.getSession();ok=!!(data&&data.session);if(!ok&&err)window.__err=err;}catch(e){console.error(e);window.__err=String(e);}
const safeBack=back.startsWith('/')&&!back.startsWith('//')?back:'./';
let popAt=0;try{popAt=+localStorage.getItem('qbcam.authPopupAt')||0;localStorage.removeItem('qbcam.authPopupAt');}catch(e){}
const isPopup=!!window.opener||Date.now()-popAt<15*60*1000;
if(ok){try{new BroadcastChannel('pp-auth').postMessage('signed-in');}catch(e){}}   // tells the game window even when Google cut the opener link
if(window.opener&&!window.opener.closed){try{window.opener.postMessage({pp:'auth',ok},location.origin);}catch(e){}}
const m=document.getElementById('m');
if(isPopup){m.textContent=ok?'Signed in! You can close this window and go back to the game.':'Sign-in didn’t finish'+(window.__err?' ('+window.__err+')':'')+'. Close this window and try again.';
  if(ok)setTimeout(()=>window.close(),250);}
else location.replace(safeBack);
</script></body></html>
